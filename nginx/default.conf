# HTTP → HTTPS redirect
server {
    listen 80;
    server_name backxpairup.zrxprudhvi.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name backxpairup.zrxprudhvi.tech;

    ssl_certificate     /etc/letsencrypt/live/backxpairup.zrxprudhvi.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backxpairup.zrxprudhvi.tech/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Proxy everything (including /metrics) to the backend.
    # /metrics auth is enforced by the backend via bearer token — no NGINX-level blocking needed.
    location / {
        proxy_pass             http://localhost:3000;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_cache_bypass     $http_upgrade;
        proxy_read_timeout     86400s;
        proxy_send_timeout     86400s;
    }
}
